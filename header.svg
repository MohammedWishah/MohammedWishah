<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Mohammed Wishah</title>
  <desc id="d">Software engineering student working with Python and moving into machine learning, based in Bochum, Germany. Available for working student and internship roles.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#292f29" stroke-width="1" opacity="0.45"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c0e0d" stop-opacity="1"/>
      <stop offset="0.62" stop-color="#0c0e0d" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0c0e0d" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="298" rx="10"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fg { fill: #d6d8d3; }
    .muted { fill: #969e95; }
    .amber { fill: #ffb000; }
    .label { font-size: 13px; letter-spacing: 1.6px; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.4s ease-out infinite; transform-origin: 55px 231px; }
    .orbit-a { animation: spin 18s linear infinite; transform-origin: 845px 150px; }
    .orbit-b { animation: spin 31s linear infinite reverse; transform-origin: 845px 150px; }
    .rise { animation: rise 0.9s ease-out both; }
    .rise.d1 { animation-delay: 0.15s; }
    .rise.d2 { animation-delay: 0.3s; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3.2); opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .pulse, .orbit-a, .orbit-b, .rise { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="#0c0e0d"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#fade)"/>

    <!-- orbit -->
    <g fill="none" stroke="#292f29" stroke-width="1.5">
      <circle cx="845" cy="150" r="52"/>
      <circle cx="845" cy="150" r="88" stroke-dasharray="3 7"/>
      <path d="M845 40V260M735 150H955" opacity="0.6"/>
    </g>
    <circle cx="845" cy="150" r="5" fill="#969e95"/>
    <g class="orbit-a"><circle cx="897" cy="150" r="5" fill="#ffb000"/></g>
    <g class="orbit-b"><circle cx="845" cy="62" r="3" fill="#d6d8d3"/></g>

    <!-- top bar -->
    <text x="40" y="36" class="mono muted label">PROFILE / MW-01</text>
    <text x="960" y="36" class="mono muted label" text-anchor="end">BOCHUM, DE · BUILD 26.10</text>
    <path d="M40 52H960" stroke="#292f29" stroke-width="1"/>

    <!-- name -->
    <text x="38" y="134" class="sans fg rise" font-size="60" font-weight="600" letter-spacing="-1.5">Mohammed Wishah</text>
    <text x="40" y="174" class="mono muted rise d1" font-size="19">Software engineering student · Python · moving into ML<tspan class="amber cursor" dx="6">▍</tspan></text>

    <!-- status -->
    <g class="rise d2">
      <circle cx="55" cy="231" r="5" class="amber pulse"/>
      <circle cx="55" cy="231" r="5" class="amber"/>
      <text x="74" y="236" class="mono amber" font-size="14" letter-spacing="1.6">AVAILABLE</text>
      <text x="176" y="236" class="mono fg" font-size="14">for working student and internship roles</text>
    </g>

    <!-- bottom bar -->
    <path d="M40 258H960" stroke="#292f29" stroke-width="1"/>
    <text x="960" y="281" class="mono muted label" text-anchor="end">AR · DE C1 · EN</text>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="10" fill="none" stroke="#292f29"/>
</svg>
